<head>
  <title>Screen ambience</title>
  <meta description="Your lights follow your monitor. Each light takes the colour of the part of the screen under it on the Layout tab." />
  <meta publisher="Monarch" />
  <meta property="mode" label="Picture mode" type="combobox" values="Standard,Vivid,Cinema,Mono,Dominant,HD" default="Standard" tooltip="Standard, Vivid, Cinema and Mono work on soft zones. Dominant paints everything the screen's strongest colour. HD follows the full picture." />
  <meta property="smoothing" label="Motion smoothing" type="number" min="0" max="100" default="50" tooltip="Higher stops flicker in fast scenes." />
  <meta property="blur" label="Blur" type="number" min="0" max="20" default="4" />
  <meta property="bright" label="Brightness" type="number" min="-100" max="100" default="0" />
  <meta property="sat" label="Saturation" type="number" min="-100" max="100" default="0" />
  <meta property="contrast" label="Contrast" type="number" min="-100" max="100" default="0" />
  <meta property="shift" label="Colour shift" type="number" min="-180" max="180" default="0" />
  <meta property="bars" label="Ignore black bars" type="boolean" default="1" tooltip="Skips the bars above and below films and beside 4:3 video, so the lights don't go dark there." />
  <meta property="flip" label="Flip left and right" type="boolean" default="0" />
</head>
<body style="margin:0;background:#000"><canvas id="c" width="320" height="200"></canvas></body>
<script>
// Zones: engine.zone gives the screen as 28 x 20 zones (hue, saturation, lightness)
// and as a 160 x 100 picture. Standard-style modes paint the zones, HD paints the picture.
const W = 160, H = 100, ZC = 28, ZR = 20;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const pic = document.createElement("canvas"); pic.width = W; pic.height = H;
const pctx = pic.getContext("2d");
const zones = document.createElement("canvas"); zones.width = ZC; zones.height = ZR;
const zctx = zones.getContext("2d");
const zimg = zctx.createImageData(ZC, ZR), pimg = pctx.createImageData(W, H);

let prev = null, prevPic = null, lastT = performance.now(), lastBuf = null;
let crop = { x: 0, y: 0, w: W, h: H }, pending = null, pendingN = 0;
let domHue = -1;

// ---- black bars -------------------------------------------------------------
function dark(px, x, y) { const i = (y * W + x) * 4; return px[i] < 22 && px[i + 1] < 22 && px[i + 2] < 22; }
function rowDark(px, y, x0, x1) { for (let x = x0; x < x1; x++) if (!dark(px, x, y)) return false; return true; }
function colDark(px, x, y0, y1) { for (let y = y0; y < y1; y++) if (!dark(px, x, y)) return false; return true; }
function detectBars(px) {
  let t = 0, b = 0;
  while (t < H * 0.3 && rowDark(px, t, 0, W)) t++;
  if (t >= H * 0.3 && rowDark(px, H >> 1, 0, W)) return null;  // the whole screen is dark: keep what we had
  while (b < H * 0.3 && rowDark(px, H - 1 - b, 0, W)) b++;
  if (Math.abs(t - b) > 3) t = b = 0;                           // only matching bars, not a dark title bar
  let l = 0, r = 0;
  while (l < W * 0.3 && colDark(px, l, t, H - b)) l++;
  while (r < W * 0.3 && colDark(px, W - 1 - r, t, H - b)) r++;
  if (Math.abs(l - r) > 3) l = r = 0;
  return { x: l, y: t, w: W - l - r, h: H - t - b };
}
function updateCrop(px) {
  if (!bars) { crop = { x: 0, y: 0, w: W, h: H }; pending = null; return; }
  const c = detectBars(px);
  if (!c) return;
  const same = (a, b) => a && b && Math.abs(a.x - b.x) <= 1 && Math.abs(a.y - b.y) <= 1 && Math.abs(a.w - b.w) <= 2 && Math.abs(a.h - b.h) <= 2;
  if (same(c, crop)) { pending = null; return; }
  if (same(c, pending)) { if (++pendingN >= 12) { crop = c; pending = null; } }   // about half a second of agreement
  else { pending = c; pendingN = 0; }
}

// ---- colour helpers -----------------------------------------------------------
function hsl2rgb(h, s, l) {
  s /= 100; l /= 100;
  const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
function lerpHue(a, b, t) { let d = b - a; if (d > 180) d -= 360; else if (d < -180) d += 360; return (a + d * t + 360) % 360; }
function rgb2hsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, l = (mx + mn) / 2;
  let h = 0, s = 0;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360; }
  return [h, s * 100, l * 100];
}

// Zone colours of the cropped area, from the 160 x 100 picture (so black bars can be skipped).
function zoneHSL(px) {
  const out = new Float32Array(ZC * ZR * 3);
  for (let zr = 0; zr < ZR; zr++) for (let zc = 0; zc < ZC; zc++) {
    const x0 = crop.x + Math.floor((zc * crop.w) / ZC), x1 = crop.x + Math.max(Math.floor(((zc + 1) * crop.w) / ZC), Math.floor((zc * crop.w) / ZC) + 1);
    const y0 = crop.y + Math.floor((zr * crop.h) / ZR), y1 = crop.y + Math.max(Math.floor(((zr + 1) * crop.h) / ZR), Math.floor((zr * crop.h) / ZR) + 1);
    let r = 0, g = 0, b = 0, n = 0;
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) { const i = (y * W + x) * 4; r += px[i]; g += px[i + 1]; b += px[i + 2]; n++; }
    const [h, s, l] = rgb2hsl(r / n, g / n, b / n);
    const k = (zr * ZC + zc) * 3; out[k] = h; out[k + 1] = s; out[k + 2] = l;
  }
  return out;
}

function frame(now) {
  const dt = Math.min(0.25, (now - lastT) / 1000); lastT = now;
  const a = smoothing <= 0 ? 1 : 1 - Math.exp(-dt / (0.02 + Math.pow(smoothing / 100, 2) * 1.2));
  const buf = engine.zone.imagedata;
  const px = new Uint8ClampedArray(buf);
  if (px.length === W * H * 4) {
    if (buf !== lastBuf) { lastBuf = buf; updateCrop(px); }
    let src;
    if (mode === "HD") {
      if (!prevPic) prevPic = new Float32Array(px);
      const d = pimg.data;
      for (let i = 0; i < px.length; i += 4) {
        for (let c = 0; c < 3; c++) { prevPic[i + c] += (px[i + c] - prevPic[i + c]) * a; d[i + c] = prevPic[i + c]; }
        d[i + 3] = 255;
      }
      pctx.putImageData(pimg, 0, 0);
      src = [pic, crop.x, crop.y, crop.w, crop.h];
    } else {
      const z = zoneHSL(px);
      if (!prev) prev = new Float32Array(z);
      if (mode === "Dominant") {
        // most saturated zone that isn't too dark leads; the hue drifts toward it
        let best = -1, bs = -1;
        for (let k = 0; k < ZC * ZR; k++) if (z[k * 3 + 2] > 12 && z[k * 3 + 1] > bs) { bs = z[k * 3 + 1]; best = k; }
        if (best >= 0) domHue = domHue < 0 ? z[best * 3] : lerpHue(domHue, z[best * 3], Math.min(1, a * 0.5));
      }
      const d = zimg.data;
      for (let k = 0; k < ZC * ZR; k++) {
        prev[k * 3] = lerpHue(prev[k * 3], z[k * 3], a);
        prev[k * 3 + 1] += (z[k * 3 + 1] - prev[k * 3 + 1]) * a;
        prev[k * 3 + 2] += (z[k * 3 + 2] - prev[k * 3 + 2]) * a;
        let h = prev[k * 3], s = prev[k * 3 + 1], l = prev[k * 3 + 2];
        if (mode === "Mono") s = 0;
        else if (mode === "Vivid") s = Math.min(100, s + 10);
        else if (mode === "Cinema") s = Math.max(0, s - 10);
        else if (mode === "Dominant" && domHue >= 0) h = domHue;
        const [r, g, b] = hsl2rgb(h, s, l);
        d[k * 4] = r; d[k * 4 + 1] = g; d[k * 4 + 2] = b; d[k * 4 + 3] = 255;
      }
      zctx.putImageData(zimg, 0, 0);
      src = [zones, 0, 0, ZC, ZR];
    }
    // Adjustments and blur as one filter; the picture is drawn a little past the edges
    // so blurring never pulls black in from outside the canvas.
    const pad = blur > 0 ? blur * 3 : 0;
    ctx.save();
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, 320, 200);
    if (flip) { ctx.translate(320, 0); ctx.scale(-1, 1); }
    ctx.filter = `hue-rotate(${shift}deg) brightness(${100 + bright}%) saturate(${100 + sat}%) contrast(${100 + contrast}%)` + (blur > 0 ? ` blur(${blur}px)` : "");
    ctx.imageSmoothingEnabled = mode === "HD";
    ctx.drawImage(src[0], src[1], src[2], src[3], src[4], -pad, -pad, 320 + pad * 2, 200 + pad * 2);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
