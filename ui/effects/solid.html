<head>
  <title>Solid colour</title>
  <meta description="Every light holds one colour." />
  <meta publisher="Monarch" />
  <meta property="color" label="Colour" type="color" default="#EDF1FB" />
</head>
<body style="margin:0;background:#000"><canvas id="c" width="320" height="200"></canvas></body>
<script>
const ctx = document.getElementById("c").getContext("2d");
function frame() { ctx.fillStyle = color; ctx.fillRect(0, 0, 320, 200); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
