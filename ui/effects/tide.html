<head>
  <title>Shadow tide</title>
  <meta description="Deep violet swells with a cold flare that rises from the centre every few seconds." />
  <meta publisher="Monarch" />
  <meta property="speed" label="Speed" type="number" min="0" max="100" default="40" />
  <meta property="base" label="Shadow colour" type="color" default="#3B1E8F" />
  <meta property="flare" label="Flare colour" type="color" default="#7FD0FF" />
  <meta property="every" label="Seconds between flares" type="number" min="2" max="20" default="6" />
</head>
<body style="margin:0;background:#000"><canvas id="c" width="320" height="200"></canvas></body>
<script>
const ctx = document.getElementById("c").getContext("2d");
let t = 0, last = performance.now(), ring = -1;
function rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function frame(now) {
  t += 0.004 + speed / 100 * 0.02;
  const [r, g, b] = rgb(base), [fr, fg, fb] = rgb(flare);
  for (let x = 0; x < 320; x += 4) {
    const w = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2 + x / 37) * Math.sin(t * 1.3 - x / 61));
    ctx.fillStyle = `rgb(${r * w},${g * w},${b * w})`;
    ctx.fillRect(x, 0, 4, 200);
  }
  if (now - last > every * 1000) { last = now; ring = 0; }
  if (ring >= 0) {
    ring += 3 + speed / 100 * 5;
    const a = Math.max(0, 1 - ring / 260);
    ctx.globalCompositeOperation = "lighter";
    ctx.lineWidth = 38;
    ctx.strokeStyle = `rgba(${fr},${fg},${fb},${a})`;
    ctx.beginPath(); ctx.arc(110, 110, ring, 0, Math.PI * 2); ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
    if (a <= 0) ring = -1;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
